services:
  - type: web
    name: gradesense-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install ./backend
    startCommand: >
      cd backend &&
      export GRADESENSE_DATABASE_URL="$DATABASE_URL" &&
      export GRADESENSE_CORS_ORIGINS="[\"https://gradesense-4weh.onrender.com\",\"$FRONTEND_URL\"]" &&
      alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GRADESENSE_ENVIRONMENT
        value: production
      - key: GRADESENSE_LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: gradesense
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
