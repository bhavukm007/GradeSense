services:
  - type: web
    name: gradesense-api
    runtime: python
    plan: free
    buildCommand: >
      pip install --upgrade pip &&
      pip install ./backend
    preDeployCommand: >
      cd backend &&
      export GRADESENSE_DATABASE_URL="$DATABASE_URL" &&
      alembic upgrade head
    startCommand: >
      cd backend &&
      export GRADESENSE_DATABASE_URL="$DATABASE_URL" &&
      export GRADESENSE_CORS_ORIGINS="[\"https://gradesense-4weh.onrender.com\"]" &&
      exec uvicorn app.main:app
      --host 0.0.0.0
      --port "$PORT"
      --proxy-headers
      --forwarded-allow-ips="*"
      --timeout-keep-alive 30
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GRADESENSE_ENVIRONMENT
        value: production
      - key: GRADESENSE_LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false

  - type: web
    name: gradesense
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_URL
        value: https://gradesense-api.onrender.com

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
